<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Feedback | VirtualFit AI</title>

    <!-- Font Awesome -->
    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: "Inter", "Segoe UI", sans-serif;
            background: #f7f5f0;
            color: #1d1d1d;
            min-height: 100vh;
        }

        /* ================= HEADER ================= */

        header {
            width: 100%;
            padding: 22px 6%;
            display: flex;
            justify-content: space-between;
            align-items: center;

            background: rgba(255,255,255,0.82);
            backdrop-filter: blur(15px);

            border-bottom: 1px solid rgba(0,0,0,0.06);
        }

        /* Logo */

        .logo {

            display: flex;

            align-items: center;

            gap: 12px;
        }

        .logo-icon {

            width: 40px;
            height: 40px;

            border-radius: 12px;

            background: #111;

            color: white;

            display: flex;

            align-items: center;

            justify-content: center;
        }

        .logo h2 {

            font-family: "Playfair Display";

            font-size: 21px;
        }

        .logo span {

            font-size: 7px;

            letter-spacing: 2px;

            color: #888;
        }

        .back-home {
            text-decoration: none;
            color: #555;
            font-size: 14px;

            display: flex;
            align-items: center;
            gap: 8px;

            transition: 0.3s;
        }

        .back-home:hover {
            color: #b18a45;
        }


        /* ================= PAGE ================= */

        .feedback-page {
            min-height: calc(100vh - 75px);

            display: flex;
            justify-content: center;
            align-items: center;

            padding: 60px 20px;

            position: relative;
            overflow: hidden;
        }

        .feedback-page::before {
            content: "";

            position: absolute;

            width: 400px;
            height: 400px;

            border-radius: 50%;

            background: rgba(190,155,92,0.12);

            filter: blur(80px);

            top: -140px;
            right: -120px;
        }

        .feedback-page::after {
            content: "";

            position: absolute;

            width: 350px;
            height: 350px;

            border-radius: 50%;

            background: rgba(100,100,100,0.07);

            filter: blur(80px);

            bottom: -150px;
            left: -100px;
        }


        /* ================= CARD ================= */

        .feedback-card {

            width: 100%;
            max-width: 680px;

            background: rgba(255,255,255,0.9);

            border: 1px solid rgba(255,255,255,0.9);

            border-radius: 28px;

            padding: 45px;

            box-shadow: 0 25px 70px rgba(0,0,0,0.09);

            backdrop-filter: blur(20px);

            position: relative;
            z-index: 2;
        }


        .feedback-icon {

            width: 62px;
            height: 62px;

            margin: 0 auto 20px;

            border-radius: 18px;

            background: #1b1b1b;

            color: #d6b36b;

            display: flex;
            align-items: center;
            justify-content: center;

            font-size: 23px;

            box-shadow: 0 12px 30px rgba(0,0,0,0.15);
        }


        .feedback-card h1 {

            text-align: center;

            font-size: 30px;

            margin-bottom: 8px;
        }


        .feedback-subtitle {

            text-align: center;

            color: #777;

            font-size: 14px;

            line-height: 1.6;

            margin-bottom: 30px;
        }


        /* ================= RATING ================= */

        .rating-title {

            text-align: center;

            font-size: 13px;

            font-weight: 600;

            margin-bottom: 12px;
        }


        .stars {

            display: flex;

            justify-content: center;

            gap: 10px;

            margin-bottom: 30px;
        }


        .star {

            border: none;

            background: none;

            font-size: 30px;

            color: #d7d3cc;

            cursor: pointer;

            transition: 0.2s;
        }


        .star:hover,
        .star.active {

            color: #c49a52;

            transform: scale(1.12);
        }


        /* ================= FORM ================= */

        .form-row {

            display: grid;

            grid-template-columns: 1fr 1fr;

            gap: 18px;
        }


        .form-group {

            margin-bottom: 20px;
        }


        .form-group label {

            display: block;

            font-size: 13px;

            font-weight: 600;

            margin-bottom: 8px;

            color: #333;
        }


        .input-box {

            position: relative;
        }


        .input-box i {

            position: absolute;

            left: 16px;

            top: 17px;

            color: #999;
        }


        input,
        select,
        textarea {

            width: 100%;

            border: 1px solid #dedbd5;

            background: #faf9f6;

            border-radius: 14px;

            outline: none;

            font-family: inherit;

            font-size: 14px;

            transition: 0.3s;
        }


        input,
        select {

            height: 52px;

            padding: 0 16px 0 45px;
        }


        textarea {

            min-height: 135px;

            padding: 16px;

            resize: vertical;
        }


        input:focus,
        select:focus,
        textarea:focus {

            border-color: #b18a45;

            background: #fff;

            box-shadow: 0 0 0 4px rgba(177,138,69,0.10);
        }


        /* ================= SUBMIT ================= */

        .submit-btn {

            width: 100%;

            height: 54px;

            border: none;

            border-radius: 14px;

            background: #1b1b1b;

            color: white;

            font-size: 14px;

            font-weight: 700;

            cursor: pointer;

            display: flex;

            justify-content: center;

            align-items: center;

            gap: 10px;

            transition: 0.3s;
        }


        .submit-btn:hover {

            background: #b18a45;

            transform: translateY(-2px);

            box-shadow: 0 12px 25px rgba(177,138,69,0.22);
        }


        /* ================= SUCCESS ================= */

        .success-message {

            display: none;

            text-align: center;

            padding: 20px;

        }


        .success-message i {

            font-size: 45px;

            color: #b18a45;

            margin-bottom: 15px;
        }


        .success-message h2 {

            margin-bottom: 8px;
        }


        .success-message p {

            color: #777;

            font-size: 14px;
        }


        /* ================= MOBILE ================= */

        @media (max-width: 600px) {

            header {
                padding: 18px 5%;
            }

            .logo {
                font-size: 21px;
            }

            .feedback-page {
                padding: 35px 15px;
            }

            .feedback-card {
                padding: 30px 20px;
                border-radius: 22px;
            }

            .feedback-card h1 {
                font-size: 27px;
            }

            .form-row {
                grid-template-columns: 1fr;
                gap: 0;
            }

            .star {
                font-size: 27px;
            }
        }

    </style>
</head>


<body>


<header>

    <div class="logo">
        <div class="logo-icon">
            <i class="fa-solid fa-wand-magic-sparkles"></i>
        </div>

        <div>
            <h2>VirtualFit</h2>
            <span>AI Virtual try-on</span>
        </div>
    </div>

    <a href="index.html" class="back-home">
        <i class="fa-solid fa-arrow-left"></i>
        Back to Home
    </a>

</header>


<main class="feedback-page">


    <div class="feedback-card">


        <!-- FORM -->

        <div id="feedbackFormContainer">

            <div class="feedback-icon">
                <i class="fa-regular fa-comment-dots"></i>
            </div>


            <h1>Share Your Experience</h1>

            <p class="feedback-subtitle">
                Your feedback helps us make VirtualFit AI smarter,
                smoother and more enjoyable.
            </p>


            <!-- RATING -->

            <p class="rating-title">
                How would you rate your experience?
            </p>


            <div class="stars">

                <button class="star" data-rating="1">
                    <i class="fa-solid fa-star"></i>
                </button>

                <button class="star" data-rating="2">
                    <i class="fa-solid fa-star"></i>
                </button>

                <button class="star" data-rating="3">
                    <i class="fa-solid fa-star"></i>
                </button>

                <button class="star" data-rating="4">
                    <i class="fa-solid fa-star"></i>
                </button>

                <button class="star" data-rating="5">
                    <i class="fa-solid fa-star"></i>
                </button>

            </div>


            <form id="feedbackForm">

                <div class="form-row">


                    <div class="form-group">

                        <label>Your Name</label>

                        <div class="input-box">

                            <i class="fa-regular fa-user"></i>

                            <input
                                type="text"
                                id="name"
                                placeholder="Enter your name">
                        </div>

                    </div>


                    <div class="form-group">

                        <label>Email</label>

                        <div class="input-box">

                            <i class="fa-regular fa-envelope"></i>

                            <input
                                type="email"
                                id="email"
                                placeholder="Enter your email">
                        </div>

                    </div>

                </div>


                <div class="form-group">

                    <label>Feedback Category</label>

                    <div class="input-box">

                        <i class="fa-solid fa-layer-group"></i>

                        <select id="category">

                            <option value="">
                                Select a category
                            </option>

                            <option>
                                Virtual Try-On
                            </option>

                            <option>
                                Wardrobe / Collection
                            </option>

                            <option>
                                Website Design
                            </option>

                            <option>
                                AI Result
                            </option>

                            <option>
                                Performance
                            </option>

                            <option>
                                Other
                            </option>

                        </select>

                    </div>

                </div>


                <div class="form-group">

                    <label>Your Feedback</label>

                    <textarea
                        id="message"
                        placeholder="Tell us about your experience..."
                        required></textarea>

                </div>


                <button type="submit" class="submit-btn">

                    Submit Feedback

                    <i class="fa-solid fa-paper-plane"></i>

                </button>

            </form>

        </div>


        <!-- SUCCESS -->

        <div class="success-message" id="successMessage">

            <i class="fa-solid fa-circle-check"></i>

            <h2>Thank You!</h2>

            <p>
                Your feedback has been received.
                We appreciate you helping improve VirtualFit AI.
            </p>

        </div>


    </div>

</main>


<script>

    let selectedRating = 0;

    const stars = document.querySelectorAll(".star");


    stars.forEach(star => {

        star.addEventListener("click", function() {

            selectedRating = Number(this.dataset.rating);

            stars.forEach(s => {

                const rating = Number(s.dataset.rating);

                s.classList.toggle(
                    "active",
                    rating <= selectedRating
                );

            });

        });

    });


    document
        .getElementById("feedbackForm")
        .addEventListener("submit", function(e) {

            e.preventDefault();


            if (selectedRating === 0) {

                alert("Please select a rating.");

                return;
            }


            document
                .getElementById("feedbackFormContainer")
                .style.display = "none";


            document
                .getElementById("successMessage")
                .style.display = "block";

        });

</script>


</body>
</html>
